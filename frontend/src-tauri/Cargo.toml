[package]
name = "camtek-aoi-manager"
version = "0.1.0"
description = "Camtek AOI Manager desktop shell"
edition = "2021"

[lib]
name = "camtek_aoi_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
