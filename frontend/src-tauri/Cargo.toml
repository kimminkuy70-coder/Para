[package]
name = "camtek-aoi-manager"
version = "0.1.0"
description = "Camtek AOI Manager desktop shell"
edition = "2021"

[lib]
name = "camtek_aoi_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: notification-area icon while an automatic watch keeps running with
# the window closed (tkinter tray.py). Part of the tauri crate itself.
# default-features = false: same as tauri's defaults minus "compression" (v12.9.32).
# With compression the built frontend is stored brotli-packed in .rdata; after the
# v12.9.30 frontend change Windows Defender's ML flagged the exe (Wacatac.B!ml) while
# v12.9.29 passed and only that packed blob differed. Plain assets are low-entropy text.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native folder chooser for the save-folder / folder-registration setup.
# gtk3 gives a synchronous dialog on Linux (build check); Windows uses its own
# native backend regardless of this feature.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
