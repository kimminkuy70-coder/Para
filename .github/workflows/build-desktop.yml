name: Build Windows Desktop (Tauri)

# 브랜치 version_wafermap = **Wafer Map 전용판(특수 버전)** 빌드.
# 본 앱(Camtek AOI Manager)과 같은 구조(Tauri 실행 파일 + Python 엔진 sidecar)지만
# Wafer Map 변환 기능만 들어간다:
#   - 엔진: tools/wafermap_engine_entry.py → param_manager.wafermap_ipc (Wafer Map 요청만).
#     다른 기능 모듈은 tools/wafermap_edition.py 가 --exclude-module 로 빼고, 빌드 뒤 다시 확인한다.
#   - 화면: frontend/wafermap/index.html → src/wafermap_main.tsx (Wafer Map 화면 하나).
#   - 실행 파일: cargo feature `wafermap` + tauri.wafermap.conf.json (이름 · 식별자 · 엔진 이름 · 트레이 없음).
#   - 자동 업데이트 없음(배치 스크립트로 폴더를 바꾸는 동작이 없다).
# 릴리즈 이름은 본 앱과 섞이지 않게 `wafermap-v{버전}` 태그, 제목 "Camtek AOI Wafer Map v{버전}".
#
# Two ways to trigger:
#   - Actions tab -> this workflow -> "Run workflow" on branch version_wafermap (enter a version).
#   - Push a tag like wafermap-v1.0.0 on this branch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Wafer Map edition version, e.g. 1.0.0"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "wafermap-v*.*.*"

permissions:
  contents: write   # the release step below creates the wafermap-v{version} tag + GitHub Release

jobs:
  build:
    runs-on: windows-latest
    env:
      APP: Camtek_AOI_WaferMap
      ENGINE: Camtek_AOI_WaferMap_engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ github.event.inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}" -replace '^wafermap-v',''
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Error "Version must be MAJOR.MINOR.PATCH (got '$v')"; exit 1 }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Wafer Map edition $v"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          key: wafermap

      - name: Stamp version (__version__ + PE version-info)
        env:
          PARA_APP_NAME: ${{ env.APP }}
          PARA_EXE_STEM: ${{ env.ENGINE }}
        run: python tools/set_version.py ${{ steps.ver.outputs.version }}

      - name: Set app version in tauri.conf.json
        shell: pwsh
        run: |
          $p = "frontend/src-tauri/tauri.conf.json"
          $j = Get-Content $p -Raw | ConvertFrom-Json
          $j.version = "${{ steps.ver.outputs.version }}"
          $j | ConvertTo-Json -Depth 20 | Set-Content $p -Encoding utf8

      # openpyxl only (tksheet = the main app's tkinter table, not used here) + PyInstaller.
      - name: Install Python deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install "openpyxl>=3.1,<4" -r requirements-build.txt

      # --debug noarchive: same as the main app (start-up time with a security scanner).
      # Every param_manager module outside the Wafer Map allowlist is excluded explicitly.
      - name: Build Python engine sidecar (PyInstaller onedir, Wafer Map modules only)
        shell: pwsh
        run: |
          $ex = @(python tools/wafermap_edition.py excludes)
          if ($LASTEXITCODE -ne 0 -or $ex.Count -lt 10) { Write-Error "exclude list failed"; exit 1 }
          $a = @('--noconfirm','--clean','--onedir','--console','--debug','noarchive',
                 '--name',$env:ENGINE,'--paths','.','--version-file','tools/version_info.txt') + $ex + @('tools/wafermap_engine_entry.py')
          & pyinstaller @a
          if ($LASTEXITCODE -ne 0) { Write-Error "pyinstaller failed"; exit 1 }
          python tools/wafermap_edition.py check "dist/$env:ENGINE"
          if ($LASTEXITCODE -ne 0) { Write-Error "edition contains modules it must not"; exit 1 }

      - name: Stage sidecar into Tauri resources
        shell: pwsh
        run: |
          $dst = "frontend/src-tauri/sidecar"
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          Copy-Item -Recurse "dist/$env:ENGINE" $dst
          if (-not (Test-Path "$dst/$env:ENGINE.exe")) { Write-Error "sidecar exe missing"; exit 1 }

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app (release, no installer, Wafer Map edition)
        working-directory: frontend
        shell: pwsh
        run: |
          $conf = (Resolve-Path "src-tauri/tauri.wafermap.conf.json").Path
          npm run tauri -- build --no-bundle --features wafermap --config $conf
          if ($LASTEXITCODE -ne 0) { Write-Error "tauri build failed"; exit 1 }

      - name: Assemble portable package
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $out = "$($env:APP)_v$ver"
          New-Item -ItemType Directory -Force $out | Out-Null
          $exe = @("frontend/src-tauri/target/release/camtek-aoi-manager.exe",
                   "frontend/src-tauri/target/release/$env:APP.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { Write-Error "native exe missing; build failed"; exit 1 }
          Copy-Item $exe "$out/$env:APP.exe"
          Copy-Item -Recurse "frontend/src-tauri/sidecar" "$out/sidecar"
          Copy-Item "docs/WAFERMAP_사용법.md" "$out/사용법.md"
          # File hashes: lets IT/security allowlist exactly these files.
          $root = (Resolve-Path $out).Path
          $lines = Get-ChildItem -Recurse -File $out | Sort-Object FullName | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1).Replace('\','/')
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $rel"
          }
          $lines | Set-Content "$out/SHA256SUMS.txt" -Encoding utf8
          Get-ChildItem $out

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}_v${{ steps.ver.outputs.version }}
          path: ${{ env.APP }}_v${{ steps.ver.outputs.version }}/
          retention-days: 30

      # Release page. Notes come from docs/release_notes/wafermap-v{version}.md (skipped when absent).
      # --latest=false: the main app's release stays the repository's "Latest".
      - name: Create GitHub Release (tag + notes + zip)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $tag = "wafermap-v$ver"
          $notes = "docs/release_notes/$tag.md"
          if (-not (Test-Path $notes)) { Write-Host "no $notes - release skipped"; exit 0 }
          $zip = "$($env:APP)_v$ver.zip"
          Compress-Archive -Path "$($env:APP)_v$ver" -DestinationPath $zip -Force
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $zip --clobber; gh release edit $tag --notes-file $notes }
          else { gh release create $tag $zip --target "${{ github.sha }}" --title "Camtek AOI Wafer Map v$ver" --notes-file $notes --latest=false }
          if ($LASTEXITCODE -ne 0) { Write-Error "release failed"; exit 1 }
